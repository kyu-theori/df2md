[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "_build"
backend-path = ["."]

[project]
name = "df2md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "fastexcel>=0.20.2",
    "polars>=1.8.2",
    "pyarrow>=24.0.0",
]
